<!DOCTYPE html>
<html>
<head>
    <title>Diagnóstico</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f5f5f5; }
        .section { background: white; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .ok { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>🔍 Diagnóstico de Libertad Financiera</h1>
    
    <div class="section">
        <h3>Verificando archivos...</h3>
        <div id="results"></div>
    </div>

    <script>
        async function check(url, name) {
            try {
                const r = await fetch(url, {method: 'HEAD'});
                const status = r.ok ? `<span class="ok">✅ ${r.status}</span>` : `<span class="error">❌ ${r.status}</span>`;
                document.getElementById('results').innerHTML += `<p>${name}: ${status}</p>`;
            } catch(e) {
                document.getElementById('results').innerHTML += `<p>${name}: <span class="error">❌ ${e.message}</span></p>`;
            }
        }

        // Verificar archivos
        check('/marketing-con-eli/index.html', 'index.html');
        check('/marketing-con-eli/assets/index-31909f9f.js', 'JS file');
        check('/marketing-con-eli/assets/index-8f2b6831.css', 'CSS file');
        check('/assets/index-31909f9f.js', 'JS (raíz)');
        check('/assets/index-8f2b6831.css', 'CSS (raíz)');
    </script>
</body>
</html>
