.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px;border-left:3px solid}

.btn-o{background:linear-gradient(135deg,var(--naranja),var(--naranja-dark));color:#fff}

function generarAlertas(){
  const hoy=new Date(); const alertas=[];
  clientes.forEach(c=>{
    if(!c.docs.contrato){const d=Math.round((hoy-new Date(c.fechaAlta))/86400000);if(d>=3)alertas.push({tipo:"contrato",urgencia:"danger",msg:`📄 Sin contrato — ${c.marca} (${d} días desde el alta)`,para:"ambos"});}
    if(!c.docs.comprobantePago&&c.diaPago<hoyDia){const d=hoyDia-c.diaPago;if(d>=3)alertas.push({tipo:"comprobante",urgencia:"danger",msg:`💳 Sin comprobante de pago — ${c.marca} (${d} días desde vencimiento)`,para:"ambos"});}
    const dv=c.diaPago-hoyDia;if(!c.pagadoMes&&c.estado==="Activo"&&dv>=0&&dv<=2)alertas.push({tipo:"vencimiento",urgencia:"warn",msg:`🔔 Vence ${dv===0?"HOY":"en "+dv+" días"} — ${c.marca} · ${fmt(c.monto)}`,para:"ambos"});
    if(c.baja){const d=Math.round((new Date(c.baja)-hoy)/86400000);if(d>=0&&d<=7)alertas.push({tipo:"baja",urgencia:"warn",msg:`⚠️ Baja en ${d} días — ${c.marca} · Perdés ${fmt(c.monto)}/mes`,para:"ambos"});}
    if(c.estado==="Activo"&&c.fechaUltimoAumento){const p=new Date(c.fechaUltimoAumento);p.setMonth(p.getMonth()+3);const d=Math.round((p-hoy)/86400000);if(d>=0&&d<=15)alertas.push({tipo:"aumento",urgencia:"orange",msg:`💚 Aumento en ${d} días — ${c.marca} → ${fmt(c.monto*1.15)}`,para:"eli"});}
  });
  tareas.filter(t=>t.persona==="Vicky"&&!t.entregada&&t.fecha).forEach(t=>{const d=Math.round((hoy-new Date(t.fecha))/86400000);if(d>=3)alertas.push({tipo:"vicky",urgencia:"danger",msg:`👩‍💼 Vicky no completó: "${t.desc}" (${d} días de retraso)`,para:"eli"});});
  return alertas;
}

async function enviarN8N(payload){
  if(N8N_WEBHOOK==="TU_WEBHOOK_N8N"){console.log("N8N no configurado:",payload);return;}
  try{await fetch(N8N_WEBHOOK,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});}catch(e){console.error("Error N8N:",e);}
}

function renderResumen(){
  const activos=clientes.filter(c=>c.estado==="Activo");
  const total=activos.reduce((s,c)=>s+c.monto,0);
  const cobrado=activos.filter(c=>c.pagadoMes).reduce((s,c)=>s+c.monto,0);
  const alertas=generarAlertas();
  const porMes={};
  clientes.forEach(c=>{const m=c.fechaAlta.substring(0,7);if(!porMes[m])porMes[m]={a:0,b:0};porMes[m].a++;if(c.baja){const mb=c.baja.substring(0,7);if(!porMes[mb])porMes[mb]={a:0,b:0};porMes[mb].b++;}});
  let acum=0,growH="";
  Object.keys(porMes).sort().forEach(m=>{acum+=porMes[m].a-porMes[m].b;growH+=`<div class="tr"><div style="font-size:11px;color:var(--text3);min-width:65px">${m}</div><div style="flex:1;padding:0 10px"><div class="growth-bar"><div class="growth-fill" style="width:${Math.min(acum/8*100,100)}%"></div></div></div><div style="font-size:12px;color:var(--verde);font-weight:800">${acum}</div></div>`;});

  // resumen semanal
  let rtxt=`📊 RESUMEN SEMANAL — MARKETING CON ELI\n${new Date().toLocaleDateString("es-AR")}\n\nCLIENTES ACTIVOS (${activos.length}):\n`;
  activos.forEach(c=>rtxt+=`• ${c.marca} — ${fmt(c.monto)} — Día ${c.diaPago}\n`);
  rtxt+=`\nTOTAL: ${fmt(total)} | COBRADO: ${fmt(cobrado)} | PENDIENTE: ${fmt(total-cobrado)}`;

  document.getElementById("mcontent").innerHTML=`
  <div class="stat-grid">
    <div class="stat" style="border-color:var(--verde)"><div style="font-size:10px;color:var(--text3)">Total Mayo 2026</div><div class="stat-val" style="color:var(--verde)">${fmt(total)}</div><div style="font-size:10px;color:var(--text3)">${activos.length} activos</div></div>
    <div class="stat" style="border-color:var(--naranja)"><div style="font-size:10px;color:var(--text3)">Cobrado</div><div class="stat-val" style="color:var(--naranja)">${fmt(cobrado)}</div></div>
    <div class="stat" style="border-color:#fbbf24"><div style="font-size:10px;color:var(--text3)">Pendiente</div><div class="stat-val" style="color:#fbbf24">${fmt(total-cobrado)}</div></div>
    <div class="stat" style="border-color:var(--text3)"><div style="font-size:10px;color:var(--text3)">Con +15%</div><div class="stat-val" style="color:var(--text2)">${fmt(activos.reduce((s,c)=>s+c.monto*1.15,0))}</div></div>
  </div>
  ${alertas.length?`<div class="card"><div class="card-title">🔔 Alertas (${alertas.length})</div>${alertas.map(a=>`<div class="alert-box ${a.urgencia==="danger"?"alert-danger":a.urgencia==="orange"?"alert-orange":"alert-warn"}">${a.msg}</div>`).join("")}</div>`:""}
  <div class="card"><div class="card-title">📈 Crecimiento</div>${growH}</div>
  <div class="card"><div class="card-title">📧 Resumen semanal</div>
    <div style="font-size:11px;color:var(--text2);background:var(--bg);padding:10px;border-radius:10px;white-space:pre-wrap;line-height:1.7" id="rtxt">${rtxt}</div>
    <button class="btn btn-p btn-sm" style="margin-top:8px" onclick="navigator.clipboard.writeText(document.getElementById('rtxt').textContent);alert('✅ Copiado')">📋 Copiar</button>
  </div>`;
}

function marcarTarde(id){const t=tareas.find(x=>x.id===id);if(!t)return;t.tarde=!t.tarde;if(t.tarde){t.entregada=true;const e=equipo.find(m=>m.nombre.toLowerCase().startsWith(t.persona.toLowerCase()));if(e)e.descuentos.push({monto:DESCUENTO_TARDE,motivo:"Tarde: "+t.desc,fecha:new Date().toLocaleDateString("es-AR")});}else{const e=equipo.find(m=>m.nombre.toLowerCase().startsWith(t.persona.toLowerCase()));if(e&&e.descuentos.length)e.descuentos.pop();}renderTareas();}

      </div>`;
    });
  });
  if(!mis.length) html+=`<div class="card" style="color:var(--text3)">Sin tareas asignadas este mes ✅</div>`;
  document.getElementById("mcontent").innerHTML=html;
}
function toggleMiT(id){const t=tareas.find(x=>x.id===id);if(t)t.entregada=!t.entregada;renderMisTareas(currentUser.nombre);}

  } else {
    const i=parseInt(v.replace("wa",""));
    publiWA[i].dias.unshift({fecha:f,campana:document.getElementById("wa-c").value,gasto:parseFloat(document.getElementById("wa-g").value)||0,conversaciones:parseInt(document.getElementById("wa-cv").value)||0});
    alert("✅ Datos cargados");
  }
  renderPubli();
}
function genReporteDiario(){
  const fecha=publiWA[0].dias[0].fecha;
  let t=`💬 REPORTE DIARIO — ${fecha}\nMarketing con Eli Hansen\n\n`;
  publiWA.forEach(m=>{const d=m.dias[0];t+=`▸ ${m.marca}\n  Campaña: ${d.campana}\n  Conversaciones: ${d.conversaciones}\n  Gasto: ${fmt(d.gasto)}\n\n`;});
  t+=`TOTAL: ${publiWA.reduce((s,m)=>s+m.dias[0].conversaciones,0)} conv. — ${fmt(publiWA.reduce((s,m)=>s+m.dias[0].gasto,0))}`;
  return t;
}
function copiarReporte(marca,tipo){
  let t=`📣 REPORTE SEMANAL — ${marca.toUpperCase()}\nMarketing con Eli Hansen\nSemana: 17-23 Mayo 2026\n\n`;
  if(tipo==="ecommerce"){
    const ec=publiEcommerce.find(x=>x.marca===marca);if(!ec)return;
    const g=ec.dias.reduce((s,d)=>s+d.gasto,0),v=ec.dias.reduce((s,d)=>s+d.ventas,0),i=ec.dias.reduce((s,d)=>s+d.ingresos,0);
    t+=`🛒 E-COMMERCE\n✅ Ventas: ${v}\n💰 Ingresos: ${fmt(i)}\n📢 Inversión: ${fmt(g)}\n📈 ROAS: ×${roas(g,i)}\n\nDetalle diario:\n`;
    ec.dias.forEach(d=>t+=`• ${d.fecha.slice(5)}: ${d.ventas} ventas — ${fmt(d.gasto)}\n`);
  } else {
    const wa=publiWA.find(x=>x.marca===marca);if(!wa)return;
    const g=wa.dias.reduce((s,d)=>s+d.gasto,0),c=wa.dias.reduce((s,d)=>s+d.conversaciones,0);
    t+=`💬 CAPTACIÓN WHATSAPP\n✅ Conversaciones: ${c}\n📢 Inversión: ${fmt(g)}\n💡 Costo/conv.: ${fmt(c>0?Math.round(g/c):0)}\n\nCampañas:\n`;
    [...new Set(wa.dias.map(d=>d.campana))].forEach(cp=>t+=`• ${cp}\n`);
  }
  t+=`\n_Marketing con Eli Hansen_`;
  navigator.clipboard.writeText(t);
  alert("✅ Reporte de "+marca+" copiado — listo para enviarte a vos y Vicky");
}

// ══════════════════════════════════════════
// INFOPRODUCTOS
// ══════════════════════════════════════════
function renderInfoprod(){
  const semana=ventasInfo.filter(v=>{const d=new Date(v.fecha);const hoy=new Date();return (hoy-d)/86400000<=7;});
  const totalSem=semana.reduce((s,v)=>s+v.monto,0);
  const totalVentas=semana.reduce((s,v)=>s+v.cantidad,0);
  const porCurso={};
  semana.forEach(v=>{if(!porCurso[v.curso])porCurso[v.curso]={ventas:0,monto:0};porCurso[v.curso].ventas+=v.cantidad;porCurso[v.curso].monto+=v.monto;});

  document.getElementById("mcontent").innerHTML=`
  <div class="stat-grid">
    <div class="stat" style="border-color:var(--verde)"><div style="font-size:10px;color:var(--text3)">Ventas esta semana</div><div class="stat-val" style="color:var(--verde)">${totalVentas}</div></div>
    <div class="stat" style="border-color:var(--naranja)"><div style="font-size:10px;color:var(--text3)">Ingresos esta semana</div><div class="stat-val" style="color:var(--naranja)">${fmt(totalSem)}</div></div>
  </div>

  <div class="card"><div class="card-title">➕ Cargar ventas de hoy</div>
    <div class="fr"><div class="fg"><label>Fecha</label><input id="ip-f" type="date" value="${new Date().toISOString().split('T')[0]}"></div>
    <div class="fg"><label>Curso vendido</label>
      <select id="ip-c">
        ${cursos.map(c=>`<option value="${c.nombre}">${c.nombre}</option>`).join("")}
        <option value="otro">Otro...</option>
      </select>
    </div></div>
    <div id="ip-otro-div" style="display:none" class="fg"><label>Nombre del curso</label><input id="ip-otro" placeholder="Nombre del curso"></div>
    <div class="fr"><div class="fg"><label>Cantidad vendida</label><input id="ip-q" type="number" placeholder="1" min="1"></div>
    <div class="fg"><label>Monto total ($)</label><input id="ip-m" type="number" placeholder="50000"></div></div>
    <div class="fg"><label>Canal de venta</label>
      <select id="ip-canal">
        <option>Systema.io</option>
        <option>DM Instagram</option>
        <option>WhatsApp</option>
        <option>Otro</option>
      </select>
    </div>
    <div class="fg"><label>Notas (opcional)</label><input id="ip-n" placeholder="Ej: cliente referido"></div>
    <button class="btn btn-p" style="width:100%;margin-top:6px" onclick="cargarVentaInfo()">✅ Registrar venta</button>
  </div>

  ${Object.keys(porCurso).length?`<div class="card"><div class="card-title">📊 Por curso esta semana</div>
    ${Object.entries(porCurso).map(([curso,data])=>`<div class="tr"><span style="font-size:12px">${curso}</span><div style="text-align:right"><div style="color:var(--verde);font-weight:700">${data.ventas} ventas</div><div style="font-size:11px;color:var(--naranja)">${fmt(data.monto)}</div></div></div>`).join("")}
  </div>`:""}

  <div class="card"><div class="card-title">📋 Historial de ventas</div>
    ${ventasInfo.length?ventasInfo.slice(0,20).map(v=>`<div class="tr">
      <div><div style="font-weight:700;font-size:12px">${v.curso}</div>
      <div style="font-size:10px;color:var(--text3)">${v.fecha} · ${v.canal}</div>
      ${v.notas?`<div style="font-size:10px;color:var(--text3)">${v.notas}</div>`:""}
      </div>
      <div style="text-align:right">
        <div style="color:var(--verde);font-weight:700">${v.cantidad} ud.</div>
        <div style="color:var(--naranja);font-weight:700">${fmt(v.monto)}</div>
        <button class="btn btn-d btn-sm" onclick="delVenta(${v.id})">🗑</button>
      </div>
    </div>`).join(""):`<div style="font-size:12px;color:var(--text3)">Sin ventas registradas aún. Cargá tu primera venta arriba 👆</div>`}
  </div>

  <div class="card"><div class="card-title">📧 Reporte semanal infoproductos</div>
    <div style="font-size:11px;color:var(--text2);background:var(--bg);padding:12px;border-radius:10px;white-space:pre-wrap;line-height:1.7" id="rep-info">${genReporteInfo()}</div>
    <button class="btn btn-p btn-sm" style="margin-top:8px" onclick="navigator.clipboard.writeText(document.getElementById('rep-info').textContent);alert('✅ Copiado')">📋 Copiar reporte</button>
  </div>

  <div class="card"><div class="card-title">⚙️ Mis cursos</div>
    ${cursos.map(c=>`<div class="tr"><span style="font-size:12px">${c.nombre}</span><button class="btn btn-d btn-sm" onclick="delCurso(${c.id})">🗑</button></div>`).join("")}
    <div style="display:flex;gap:8px;margin-top:10px">
      <input id="nc" placeholder="Nombre del nuevo curso" style="flex:1">
      <button class="btn btn-p btn-sm" onclick="addCurso()">➕ Agregar</button>
    </div>
  </div>`;

  document.getElementById("ip-c").addEventListener("change",function(){
    document.getElementById("ip-otro-div").style.display=this.value==="otro"?"block":"none";
  });
}

function cargarVentaInfo(){
  const f=document.getElementById("ip-f").value;
  let curso=document.getElementById("ip-c").value;
  if(curso==="otro") curso=document.getElementById("ip-otro").value.trim();
  const q=parseInt(document.getElementById("ip-q").value)||1;
  const m=parseFloat(document.getElementById("ip-m").value)||0;
  const canal=document.getElementById("ip-canal").value;
  const n=document.getElementById("ip-n").value;
  if(!f||!curso||!m){alert("Completá fecha, curso y monto");return;}
  ventasInfo.unshift({id:nextId++,fecha:f,curso,cantidad:q,monto:m,canal,notas:n});
  alert("✅ Venta registrada: "+curso);
  renderInfoprod();
}
function delVenta(id){if(confirm("¿Eliminar?")){ventasInfo=ventasInfo.filter(v=>v.id!==id);renderInfoprod();}}
function addCurso(){const n=document.getElementById("nc").value.trim();if(!n)return;cursos.push({id:nextId++,nombre:n});renderInfoprod();}
function delCurso(id){if(confirm("¿Eliminar curso?"))cursos=cursos.filter(c=>c.id!==id);renderInfoprod();}
function genReporteInfo(){
  const semana=ventasInfo.filter(v=>(new Date()-new Date(v.fecha))/86400000<=7);
  if(!semana.length) return "Sin ventas esta semana aún.";
  const total=semana.reduce((s,v)=>s+v.monto,0);
  const cant=semana.reduce((s,v)=>s+v.cantidad,0);
  let t=`🎓 REPORTE INFOPRODUCTOS — SEMANA\nMarketing con Eli Hansen\n${new Date().toLocaleDateString("es-AR")}\n\n`;
  t+=`✅ Total vendido: ${cant} unidades\n💰 Ingresos: ${fmt(total)}\n\nDETALLE:\n`;
  const pc={};semana.forEach(v=>{if(!pc[v.curso])pc[v.curso]={q:0,m:0};pc[v.curso].q+=v.cantidad;pc[v.curso].m+=v.monto;});
  Object.entries(pc).forEach(([c,d])=>t+=`• ${c}: ${d.q} ventas — ${fmt(d.m)}\n`);
  t+=`\n_Reporte generado automáticamente — Marketing con Eli Hansen_`;
  return t;
}

// ══════════════════════════════════════════
// ALERTAS (con N8N)
// ══════════════════════════════════════════
function renderAlertas(){
  const alertas=generarAlertas();
  document.getElementById("mcontent").innerHTML=`
  <div class="card"><div class="card-title">🔔 Alertas activas (${alertas.length})</div>
    ${alertas.length?alertas.map(a=>`<div class="alert-box ${a.urgencia==="danger"?"alert-danger":a.urgencia==="orange"?"alert-orange":"alert-warn"}">${a.msg} <span style="font-size:10px;opacity:.7">[${a.para}]</span></div>`).join(""):`<div style="color:var(--text3);font-size:12px">Sin alertas activas ✅</div>`}
  </div>

  <div class="card"><div class="card-title">🔗 Configuración N8N</div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:10px">Pegá la URL del webhook de N8N para activar alertas automáticas</div>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <input id="n8n-url" placeholder="https://tu-n8n.app.n8n.cloud/webhook/..." style="flex:1" value="${N8N_WEBHOOK!=="TU_WEBHOOK_N8N"?N8N_WEBHOOK:""}">

    </div>

  </div>

  <div class="card"><div class="card-title">📋 Lógica de alertas configurada</div>
    <div style="font-size:12px;color:var(--text2);line-height:2">
      <div style="margin-bottom:10px"><span style="color:var(--verde);font-weight:700">Van a Eli + Vicky (WA + Email):</span><br>
      • Sin contrato firmado (3+ días desde el alta)<br>
      • Comprobante no subido (3+ días post vencimiento)<br>
      • Vencimiento de pago en ≤2 días<br>
      • Baja próxima de cliente</div>
      <div><span style="color:var(--naranja);font-weight:700">Van solo a Eli:</span><br>
      • Aumento próximo (15 días antes)<br>
      • Vicky no completó una tarea (3+ días de retraso)<br>
      • Reporte semanal todos los lunes<br>
      • Reporte infoproductos todos los lunes</div>
    </div>
  </div>

  <div class="card" style="border-left:3px solid var(--naranja)"><div class="card-title">⚙️ Cómo configurar N8N</div>
    <div style="font-size:12px;color:var(--text2);line-height:2">
      1. Entrá a <b style="color:var(--verde)">n8n.io</b> → tu instancia<br>
      2. Creá un nuevo workflow<br>
      3. Agregá un nodo <b style="color:var(--verde)">"Webhook"</b> como trigger<br>
      4. Copiá la URL del webhook y pegala arriba<br>
      5. Agregá nodos de <b style="color:var(--naranja)">Gmail</b> y <b style="color:var(--naranja)">WhatsApp Business</b><br>
      6. Configurá los destinatarios según la lógica de arriba<br>
      7. Activá el workflow ✅
    </div>
  </div>`;
}

async function probarN8N(){
  const url=document.getElementById("n8n-url").value.trim();
  if(!url){alert("Ingresá la URL del webhook");return;}
  try{
    await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({test:true,mensaje:"🧪 Prueba desde Marketing con Eli Hansen",fecha:new Date().toLocaleDateString("es-AR")})});
    alert("✅ Mensaje enviado a N8N — verificá que llegó el webhook");
  } catch(e){alert("❌ Error al conectar con N8N: "+e.message);}
}
