// ══════════════════════════════════════
function genAlertas(){
  const hoy=new Date();const al=[];
  clientes.forEach(c=>{
    if(!c.docs.contrato){const d=Math.round((hoy-new Date(c.fechaAlta))/86400000);if(d>=3)al.push({u:"danger",msg:`📄 Sin contrato — ${c.marca} (${d} días desde alta)`,para:"ambos"});}
    if(!c.docs.comprobantePago&&c.diaPago<hoyDia){const d=hoyDia-c.diaPago;if(d>=3)al.push({u:"danger",msg:`💳 Sin comprobante — ${c.marca} (${d} días post vencimiento)`,para:"ambos"});}
    const dv=c.diaPago-hoyDia;if(!c.pagadoMes&&c.estado==="Activo"&&dv>=0&&dv<=2)al.push({u:"warn",msg:`🔔 Vence ${dv===0?"HOY":"en "+dv+" días"} — ${c.marca} · ${fmt(c.monto)}`,para:"ambos"});
    if(c.baja){const d=Math.round((new Date(c.baja)-hoy)/86400000);if(d>=0&&d<=7)al.push({u:"warn",msg:`⚠️ Baja en ${d} días — ${c.marca}`,para:"ambos"});}
    if(c.estado==="Activo"&&c.fechaUltimoAumento){const p=new Date(c.fechaUltimoAumento);p.setMonth(p.getMonth()+3);const d=Math.round((p-hoy)/86400000);if(d>=0&&d<=15)al.push({u:"orange",msg:`💚 Aumento en ${d} días — ${c.marca} → ${fmt(c.monto*1.15)}`,para:"eli"});}
  });
  tareas.filter(t=>t.persona==="Vicky"&&!t.entregada&&t.fecha).forEach(t=>{const d=Math.round((hoy-new Date(t.fecha))/86400000);if(d>=3)al.push({u:"danger",msg:`👩‍💼 Vicky atrasada: "${t.desc}" (${d} días)`,para:"eli"});});
  tareas.filter(t=>t.persona!=="Vicky"&&!t.entregada&&t.fecha).forEach(t=>{const d=Math.round((hoy-new Date(t.fecha))/86400000);if(d>=3)al.push({u:"warn",msg:`⏰ ${t.persona} atrasado/a: "${t.desc}" (${d} días)`,para:"eli"});});
  return al;
}

}

function rResumen(){
  const act=clientes.filter(c=>c.estado==="Activo");
  const tot=act.reduce((s,c)=>s+c.monto,0);
  const cob=act.filter(c=>c.pagadoMes).reduce((s,c)=>s+c.monto,0);
  const al=genAlertas();
  const pm={};clientes.forEach(c=>{const m=c.fechaAlta.substring(0,7);if(!pm[m])pm[m]={a:0,b:0};pm[m].a++;if(c.baja){const mb=c.baja.substring(0,7);if(!pm[mb])pm[mb]={a:0,b:0};pm[mb].b++;}});
  let ac=0,gH="";Object.keys(pm).sort().forEach(m=>{ac+=pm[m].a-pm[m].b;gH+=`<div class="tr"><div style="font-size:11px;color:var(--text3);min-width:65px">${m}</div><div style="flex:1;padding:0 10px"><div class="gb"><div class="gf" style="width:${Math.min(ac/8*100,100)}%"></div></div></div><div style="font-size:12px;color:var(--v);font-weight:800">${ac}</div></div>`;});
  let rt=`📊 RESUMEN SEMANAL — MARKETING CON ELI\n${new Date().toLocaleDateString("es-AR")}\n\nCLIENTES ACTIVOS (${act.length}):\n`;
  act.forEach(c=>rt+=`• ${c.marca} — ${fmt(c.monto)} — Día ${c.diaPago}\n`);
  rt+=`\nTOTAL: ${fmt(tot)} | COBRADO: ${fmt(cob)} | PENDIENTE: ${fmt(tot-cob)}`;
  document.getElementById("mc").innerHTML=`
  <div class="sg">
    <div class="st" style="border-color:var(--v)"><div style="font-size:10px;color:var(--text3)">Total Mayo 2026</div><div class="sv" style="color:var(--v)">${fmt(tot)}</div><div style="font-size:10px;color:var(--text3)">${act.length} activos</div></div>
    <div class="st" style="border-color:var(--n)"><div style="font-size:10px;color:var(--text3)">Cobrado</div><div class="sv" style="color:var(--n)">${fmt(cob)}</div></div>
    <div class="st" style="border-color:#fbbf24"><div style="font-size:10px;color:var(--text3)">Pendiente</div><div class="sv" style="color:#fbbf24">${fmt(tot-cob)}</div></div>
    <div class="st" style="border-color:var(--text3)"><div style="font-size:10px;color:var(--text3)">Con +15%</div><div class="sv" style="color:var(--text2)">${fmt(act.reduce((s,c)=>s+c.monto*1.15,0))}</div></div>
  </div>
  ${al.length?`<div class="card"><div class="ct">🔔 Alertas (${al.length})</div>${al.map(a=>`<div class="ab ${a.u==="danger"?"ad":a.u==="orange"?"ao":"aw"}">${a.msg}</div>`).join("")}</div>`:""}
  <div class="card"><div class="ct">📈 Crecimiento</div>${gH}</div>
  <div class="card"><div class="ct">📧 Resumen semanal</div>
    <div style="font-size:11px;color:var(--text2);background:var(--bg);padding:10px;border-radius:10px;white-space:pre-wrap;line-height:1.7" id="rtxt">${rt}</div>
    <button class="btn bp bsm" style="margin-top:8px" onclick="navigator.clipboard.writeText(document.getElementById('rtxt').textContent);alert('✅ Copiado')">📋 Copiar</button>
  </div>`;
}

function addUsuario(){
  const n=document.getElementById("un").value.trim();
  const k=document.getElementById("uk").value.trim().toLowerCase();
  const p=document.getElementById("up").value.trim();
  const r=document.getElementById("ur").value;
  const e=document.getElementById("ue").value.trim();
  const w=document.getElementById("uw").value.trim();
  if(!n||!k||!p){alert("Completá nombre, usuario y contraseña");return;}
  if(USUARIOS[k]){alert("Ya existe un usuario con ese nombre");return;}
  USUARIOS[k]={pass:p,rol:r,nombre:n,email:e,wa:w};
  alert("✅ Usuario creado: "+n);
  rUsuarios();
}

function eliminarUsuario(key){
  if(!confirm("¿Eliminar usuario "+USUARIOS[key].nombre+"?"))return;
  delete USUARIOS[key];
  rUsuarios();
}

    ${["todos","Xavi","Vale","Vicky","Eli"].map(p=>`<button class="btn bsm bg2c" onclick="filtrarT('${p}')">${p==="todos"?"Todos":p}</button>`).join("")}

    tm.filter(t=>t.semana===s).forEach(t=>{
      const col=COLORES[t.persona]||"#94a3b8";

function filtrarT(p){document.querySelectorAll(".ti").forEach(el=>{el.style.display=(p==="todos"||el.dataset.persona===p)?"block":"none";});}
function addTarea(){tareas.push({id:nextId++,persona:document.getElementById("tp").value,marca:document.getElementById("tm2").value,tipo:document.getElementById("tti").value,semana:document.getElementById("ts2").value,desc:document.getElementById("td").value,fecha:document.getElementById("tf").value,notas:document.getElementById("tn2").value,entregada:false,tarde:false,fechaEntrega:null,mes:"2026-05"});rTareas();}
function toggleT(id){const t=tareas.find(x=>x.id===id);if(t){t.entregada=!t.entregada;t.fechaEntrega=t.entregada?new Date().toLocaleDateString("es-AR"):null;if(!t.entregada)t.tarde=false;}rTareas();}
function marcarTarde(id){
  const t=tareas.find(x=>x.id===id);if(!t)return;t.tarde=!t.tarde;
  if(t.tarde){t.entregada=true;t.fechaEntrega=new Date().toLocaleDateString("es-AR");
    const e=equipo.find(m=>m.nombre.toLowerCase().startsWith(t.persona.toLowerCase()));
    if(e)e.descuentos.push({monto:DESCUENTO,motivo:"Tarde: "+t.desc,fecha:new Date().toLocaleDateString("es-AR")});
    envN8N({tipo:"tarea_tarde",persona:t.persona,tarea:t.desc,descuento:DESCUENTO});
  } else {const e=equipo.find(m=>m.nombre.toLowerCase().startsWith(t.persona.toLowerCase()));if(e&&e.descuentos.length)e.descuentos.pop();}
  rTareas();
}
function delTarea(id){if(confirm("¿Eliminar?")){tareas=tareas.filter(x=>x.id!==id);rTareas();}}

// MIS TAREAS (editor)
function rMisTareas(nombre){
  const mis=tareas.filter(t=>t.persona===nombre&&t.mes==="2026-05");
  const desc=mis.filter(t=>t.tarde).length*DESCUENTO;
  let h=`<div class="sg">
    <div class="st" style="border-color:var(--v)"><div style="font-size:10px;color:var(--text3)">Mis tareas</div><div class="sv" style="color:var(--v)">${mis.length}</div></div>
    <div class="st" style="border-color:var(--n)"><div style="font-size:10px;color:var(--text3)">Entregadas</div><div class="sv" style="color:var(--n)">${mis.filter(t=>t.entregada).length}</div></div>
    <div class="st" style="border-color:#f87171"><div style="font-size:10px;color:var(--text3)">Tarde</div><div class="sv" style="color:#f87171">${mis.filter(t=>t.tarde).length}</div></div>
    <div class="st" style="border-color:#fbbf24"><div style="font-size:10px;color:var(--text3)">Descuentos</div><div class="sv" style="color:#fbbf24">${fmt(desc)}</div></div>
  </div>`;
  const sem=[...new Set(mis.map(t=>t.semana))].sort();
  sem.forEach(s=>{
    h+=`<div class="wt">📅 ${s}</div>`;
    mis.filter(t=>t.semana===s).forEach(t=>{
      h+=`<div class="ti ${t.entregada?"done":""} ${t.tarde?"late":""}">
        <div style="font-weight:700;font-size:12px">${t.desc||t.tipo} ${t.tarde?`<span class="badge br">⚠️ TARDE</span>`:""} ${t.entregada&&t.fechaEntrega?`<span class="badge bg">✅ ${t.fechaEntrega}</span>`:""}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:2px">${t.marca} · Límite: ${t.fecha}</div>
        ${t.notas?`<div style="font-size:10px;color:var(--text3);margin-top:4px;background:var(--bg);padding:5px;border-radius:6px">${t.notas}</div>`:""}
        ${!t.entregada?`<button class="btn bsm bs" style="margin-top:6px" onclick="marcarRealizado(${t.id})">✅ Marcar como REALIZADO</button>`:`<div style="font-size:11px;color:var(--v);margin-top:6px">✅ Entregado el ${t.fechaEntrega}</div>`}
      </div>`;
    });
  });
  if(!mis.length)h+=`<div class="card" style="color:var(--text3)">Sin tareas asignadas ✅</div>`;
  document.getElementById("mc").innerHTML=h;
}
function marcarRealizado(id){
  const t=tareas.find(x=>x.id===id);if(!t)return;
  t.entregada=true;t.fechaEntrega=new Date().toLocaleDateString("es-AR");
  const hoy=new Date();const limite=new Date(t.fecha);
  if(hoy>limite){t.tarde=true;const e=equipo.find(m=>m.nombre.toLowerCase().startsWith(t.persona.toLowerCase()));if(e)e.descuentos.push({monto:DESCUENTO,motivo:"Tarde: "+t.desc,fecha:t.fechaEntrega});alert("✅ Marcado como realizado — ⚠️ Llegó tarde, se descuentan "+fmt(DESCUENTO));}
  else alert("✅ Tarea marcada como realizada el "+t.fechaEntrega);
  rMisTareas(currentUser.nombre);
}

function switchPT(t){
  ["wa","ec","rep","carga"].forEach(s=>{
    const el=document.getElementById("ps-"+s);if(el)el.style.display=s===t?"block":"none";
    const btn=document.getElementById("pt-"+s);if(btn)btn.className=s===t?"ptb active":"ptb";
  });
}

function toggleCC(){
  const i=parseInt(document.getElementById("cc-sel").value);
  const esEc=publiCuentas[i].tipo==="ecommerce";
  document.getElementById("cc-wa-f").style.display=esEc?"none":"block";
  document.getElementById("cc-ec-f").style.display=esEc?"block":"none";
}

function cargarCampana(){
  const i=parseInt(document.getElementById("cc-sel").value);
  const c=publiCuentas[i];const nombre=document.getElementById("cc-nombre").value;const f=document.getElementById("cc-f").value;
  if(!nombre){alert("Ingresá el nombre de la campaña");return;}
  if(c.tipo==="whatsapp"){c.campanas.push({nombre,gasto:parseFloat(document.getElementById("cc-g").value)||0,conversaciones:parseInt(document.getElementById("cc-cv").value)||0,fecha:f});}
  else{c.campanas.push({nombre,gasto:parseFloat(document.getElementById("cc-eg").value)||0,ventas:parseInt(document.getElementById("cc-ev").value)||0,ingresos:parseFloat(document.getElementById("cc-ei").value)||0,fecha:f});}
  alert("✅ Campaña agregada: "+nombre);rPubli();
}

function copiarRepCuenta(id){
  const c=publiCuentas.find(x=>x.id===id);if(!c)return;
  let t=`📣 REPORTE — ${c.marca.toUpperCase()}\nMarketing con Eli Hansen\nSemana: 19-25 Mayo 2026\n\n`;
  if(c.tipo==="whatsapp"){
    t+=`💬 CAMPAÑAS DE CAPTACIÓN (WhatsApp)\n\n`;
    c.campanas.forEach(cp=>{t+=`▸ ${cp.nombre}\n  Gasto: ${fmt(cp.gasto)}\n  Conversaciones: ${cp.conversaciones}\n  Costo/conv.: ${fmt(cp.conversaciones>0?Math.round(cp.gasto/cp.conversaciones):0)}\n\n`;});
    const tG=c.campanas.reduce((s,cp)=>s+cp.gasto,0);const tCv=c.campanas.reduce((s,cp)=>s+cp.conversaciones,0);
    t+=`TOTAL:\n• Gasto: ${fmt(tG)}\n• Conversaciones: ${tCv}\n• Costo por conversación: ${fmt(tCv>0?Math.round(tG/tCv):0)}`;
  } else {
    t+=`🛒 CAMPAÑAS ECOMMERCE\n\n`;
    c.campanas.forEach(cp=>{t+=`▸ ${cp.nombre}\n  Gasto: ${fmt(cp.gasto)}\n  Ventas: ${cp.ventas||0}\n  Ingresos: ${fmt(cp.ingresos||0)}\n  ROAS: ×${cp.gasto>0?((cp.ingresos||0)/cp.gasto).toFixed(2):"—"}\n\n`;});
    const tG=c.campanas.reduce((s,cp)=>s+cp.gasto,0);const tV=c.campanas.reduce((s,cp)=>s+(cp.ventas||0),0);const tI=c.campanas.reduce((s,cp)=>s+(cp.ingresos||0),0);
    t+=`TOTAL:\n• Gasto: ${fmt(tG)}\n• Ventas: ${tV}\n• Ingresos: ${fmt(tI)}\n• ROAS: ×${tG>0?(tI/tG).toFixed(2):"—"}`;
  }
  t+=`\n\n_Marketing con Eli Hansen_`;
  navigator.clipboard.writeText(t);alert("✅ Reporte de "+c.marca+" copiado");
}

function genRepCompleto(){
  let t=`📣 REPORTE SEMANAL COMPLETO\nMarketing con Eli Hansen — Semana 19-25 Mayo 2026\n\n`;
  t+=`💬 CUENTAS WHATSAPP:\n`;
  publiCuentas.filter(c=>c.tipo==="whatsapp").forEach(c=>{
    const g=c.campanas.reduce((s,cp)=>s+cp.gasto,0);const cv=c.campanas.reduce((s,cp)=>s+cp.conversaciones,0);
    t+=`▸ ${c.marca}: ${cv} conv. — ${fmt(g)}\n`;
  });
  t+=`\n🛒 CUENTAS ECOMMERCE:\n`;
  publiCuentas.filter(c=>c.tipo==="ecommerce").forEach(c=>{
    const g=c.campanas.reduce((s,cp)=>s+cp.gasto,0);const v=c.campanas.reduce((s,cp)=>s+(cp.ventas||0),0);const i=c.campanas.reduce((s,cp)=>s+(cp.ingresos||0),0);
    t+=`▸ ${c.marca}: ${v} ventas — ${fmt(i)} — ROAS ×${g>0?(i/g).toFixed(2):"—"}\n`;
  });
  return t;
}

// INFOPRODUCTOS
// ══════════════════════════════════════
function rInfoprod(){
  const sem=ventas.filter(v=>(new Date()-new Date(v.fecha))/86400000<=7);
  const totS=sem.reduce((s,v)=>s+v.monto,0);const totV=sem.reduce((s,v)=>s+v.cantidad,0);
  const pc={};sem.forEach(v=>{if(!pc[v.curso])pc[v.curso]={q:0,m:0};pc[v.curso].q+=v.cantidad;pc[v.curso].m+=v.monto;});
  document.getElementById("mc").innerHTML=`
  <div class="sg">
    <div class="st" style="border-color:var(--v)"><div style="font-size:10px;color:var(--text3)">Ventas semana</div><div class="sv" style="color:var(--v)">${totV}</div></div>
    <div class="st" style="border-color:var(--n)"><div style="font-size:10px;color:var(--text3)">Ingresos semana</div><div class="sv" style="color:var(--n)">${fmt(totS)}</div></div>
  </div>
  <div class="card"><div class="ct">➕ Cargar venta de hoy</div>
    <div class="fr"><div class="fg"><label>Fecha</label><input id="ipf" type="date" value="${new Date().toISOString().split('T')[0]}"></div>
    <div class="fg"><label>Curso</label><select id="ipc" onchange="toggleOtro()">${cursos.map(c=>`<option value="${c.nombre}">${c.nombre}</option>`).join("")}<option value="otro">Otro...</option></select></div></div>
    <div id="ip-otro" style="display:none" class="fg"><label>Nombre del curso</label><input id="ipo"></div>
    <div class="fr"><div class="fg"><label>Cantidad</label><input id="ipq" type="number" min="1" placeholder="1"></div><div class="fg"><label>Monto ($)</label><input id="ipm" type="number"></div></div>
    <div class="fg"><label>Canal</label><select id="ipca"><option>Systema.io</option><option>DM Instagram</option><option>WhatsApp</option><option>Otro</option></select></div>
    <button class="btn bp" style="width:100%;margin-top:6px" onclick="cargarVenta()">✅ Registrar venta</button>
  </div>
  ${Object.keys(pc).length?`<div class="card"><div class="ct">📊 Por curso esta semana</div>${Object.entries(pc).map(([c,d])=>`<div class="tr"><span style="font-size:12px">${c}</span><div style="text-align:right"><div style="color:var(--v);font-weight:700">${d.q} ventas</div><div style="font-size:11px;color:var(--n)">${fmt(d.m)}</div></div></div>`).join("")}</div>`:""}
  <div class="card"><div class="ct">📋 Historial</div>
    ${ventas.length?ventas.slice(0,15).map(v=>`<div class="tr"><div><div style="font-weight:700;font-size:12px">${v.curso}</div><div style="font-size:10px;color:var(--text3)">${v.fecha} · ${v.canal}</div></div><div style="text-align:right"><div style="color:var(--v);font-weight:700">${v.cantidad} ud.</div><div style="color:var(--n)">${fmt(v.monto)}</div><button class="btn bd bsm" onclick="delVenta(${v.id})">🗑</button></div></div>`).join(""):`<div style="font-size:12px;color:var(--text3)">Sin ventas registradas aún 👆</div>`}
  </div>
  <div class="card"><div class="ct">⚙️ Mis cursos</div>
    ${cursos.map(c=>`<div class="tr"><span style="font-size:12px">${c.nombre}</span><button class="btn bd bsm" onclick="delCurso(${c.id})">🗑</button></div>`).join("")}
    <div style="display:flex;gap:8px;margin-top:10px"><input id="nc" placeholder="Nombre del nuevo curso" style="flex:1"><button class="btn bp bsm" onclick="addCurso()">➕</button></div>
  </div>`;
  document.getElementById("ipc").addEventListener("change",function(){document.getElementById("ip-otro").style.display=this.value==="otro"?"block":"none";});
}
function toggleOtro(){const s=document.getElementById("ipc");if(s)document.getElementById("ip-otro").style.display=s.value==="otro"?"block":"none";}
function cargarVenta(){let c=document.getElementById("ipc").value;if(c==="otro")c=document.getElementById("ipo").value.trim();const f=document.getElementById("ipf").value;const q=parseInt(document.getElementById("ipq").value)||1;const m=parseFloat(document.getElementById("ipm").value)||0;if(!f||!c||!m){alert("Completá fecha, curso y monto");return;}ventas.unshift({id:nextId++,fecha:f,curso:c,cantidad:q,monto:m,canal:document.getElementById("ipca").value});alert("✅ Venta registrada: "+c);rInfoprod();}
function delVenta(id){if(confirm("¿Eliminar?"))ventas=ventas.filter(v=>v.id!==id);rInfoprod();}
function addCurso(){const n=document.getElementById("nc").value.trim();if(!n)return;cursos.push({id:nextId++,nombre:n});rInfoprod();}
function delCurso(id){if(confirm("¿Eliminar?"))cursos=cursos.filter(c=>c.id!==id);rInfoprod();}

function rFinanzas(){
  const tAg=gAg.reduce((s,g)=>s+g.m,0);const tPer=gPer.reduce((s,g)=>s+g.m,0);const tFact=clientes.filter(c=>c.estado==="Activo").reduce((s,c)=>s+c.monto,0);const gan=tFact-tAg-tPer;
  document.getElementById("mc").innerHTML=`
  <div class="card"><div class="ct">🏢 Gastos agencia</div>${gAg.map(g=>`<div class="tr"><span style="font-size:12px">${g.c}</span><span style="color:#f87171;font-weight:700">${fmt(g.m)}</span></div>`).join("")}<div style="border-top:2px solid var(--border2);margin-top:10px;padding-top:8px;display:flex;justify-content:space-between;font-weight:800"><span>Total</span><span style="color:#f87171">${fmt(tAg)}</span></div></div>
  <div class="card"><div class="ct">👤 Gastos personales</div>${gPer.map(g=>`<div class="tr"><span style="font-size:12px">${g.c}</span><span style="color:#fbbf24;font-weight:700">${fmt(g.m)}</span></div>`).join("")}<div style="border-top:2px solid var(--border2);margin-top:10px;padding-top:8px;display:flex;justify-content:space-between;font-weight:800"><span>Total</span><span style="color:#fbbf24">${fmt(tPer)}</span></div></div>
  <div class="card" style="border-left:3px solid var(--v)"><div class="ct">🎯 Punto de equilibrio</div>
    <div class="tr"><span style="color:var(--text3);font-size:12px">Facturación</span><span style="color:var(--v);font-weight:800">${fmt(tFact)}</span></div>
    <div class="tr"><span style="color:var(--text3);font-size:12px">− Gastos agencia</span><span style="color:#f87171;font-weight:700">− ${fmt(tAg)}</span></div>
    <div class="tr"><span style="color:var(--text3);font-size:12px">− Gastos personales</span><span style="color:#fbbf24;font-weight:700">− ${fmt(tPer)}</span></div>
    <div style="border-top:2px solid var(--border2);margin-top:8px;padding-top:8px">
      <div class="tr"><span style="font-weight:800">Mínimo a facturar</span><span style="color:var(--n);font-weight:900;font-size:15px">${fmt(tAg+tPer)}</span></div>
      <div class="tr"><span style="font-weight:800">Ganancia neta</span><span style="color:${gan>=0?"var(--v)":"#f87171"};font-weight:900;font-size:15px">${fmt(gan)}</span></div>
    </div>
  </div>
  <div class="card"><div class="ct">👥 Descuentos por entregas tarde</div>
    ${equipo.filter(e=>e.descuentos.length).map(e=>`<div class="tr"><span>${e.nombre}</span><span style="color:#f87171;font-weight:700">− ${fmt(e.descuentos.reduce((s,d)=>s+d.monto,0))}</span></div>${e.descuentos.map(d=>`<div style="font-size:10px;color:var(--text3);padding:2px 0 2px 10px">• ${d.motivo} (${d.fecha})</div>`).join("")}`).join("")||`<div style="font-size:12px;color:var(--text3)">Sin descuentos ✅</div>`}
  </div>`;
}

function rDocs(){
  let h=`<div class="card"><div class="ct">📎 Estado documentos</div>`;
  clientes.forEach(c=>{h+=`<div class="tr"><div><div style="font-weight:700;font-size:12px">${c.marca}</div><div style="display:flex;gap:4px;margin-top:4px;flex-wrap:wrap">${c.docs.contrato?`<span class="badge bg">📄 Contrato</span>`:`<span class="badge br">📄 Pendiente</span>`}${c.docs.comprobantePago?`<span class="badge bg">💳 Pago</span>`:`<span class="badge by">💳 Sin subir</span>`}${c.docs.comprobanteNuestro?`<span class="badge bg">🧾 Factura</span>`:`<span class="badge by">🧾 Sin subir</span>`}</div></div><button class="btn bsm bo" onclick="abrirDocs(${c.id})">📎 Gestionar</button></div>`;});
  document.getElementById("mc").innerHTML=h+`</div>`;
}

async function probarN8N(){const url=document.getElementById("n8n-url").value.trim();if(!url)return;try{await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({test:true,msg:"🧪 Prueba desde Marketing con Eli Hansen",fecha:new Date().toLocaleDateString("es-AR")})});alert("✅ Enviado a N8N — verificá que llegó");}catch(e){alert("❌ Error: "+e.message);}}
</script>
