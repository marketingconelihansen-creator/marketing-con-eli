<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libertad Financiera</title>
    <link rel="stylesheet" href="/marketing-con-eli/assets/index-8f2b6831.css">
    <style>
        body { margin: 0; padding: 0; font-family: system-ui; }
        #loading { display: flex; align-items: center; justify-content: center; height: 100vh; background: #f0f0f0; }
        .spinner { width: 50px; height: 50px; border: 4px solid #ddd; border-top-color: #3498db; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <div id="loading">
        <div class="spinner"></div>
    </div>
    
    <script type="module">
        // Cargar y ejecutar el script de React
        import('/marketing-con-eli/assets/index-31909f9f.js').then(module => {
            // El módulo debería haberse cargado
            console.log('✅ Módulo cargado correctamente');
            document.getElementById('loading').style.display = 'none';
        }).catch(error => {
            console.error('❌ Error cargando módulo:', error);
            document.getElementById('loading').innerHTML = `<div style="color: red; padding: 20px; text-align: center;"><h2>Error cargando la app</h2><p>${error.message}</p></div>`;
        });
    </script>
</body>
</html>
